apply plugin: 'com.android.application'

android {
    compileSdk 36
    namespace "org.las2mile.server"
    defaultConfig {
        applicationId "org.las2mile.scrcpy"
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
    }

    task copyRelease(dependsOn: ['assembleRelease'], type: Copy){
        from(file("build/outputs/apk/release/")) {
            include "*.apk"
        }
        into file('../app/src/main/assets')
        rename { String fileName ->
            'scrcpy-server.jar'
        }
    }

    task deleteServer(type: Delete){
	delete "../app/src/main/assets/scrcpy-server.jar"
   }

    clean.dependsOn deleteServer


    task copyDebug (dependsOn: ['assembleDebug'], type: Copy){
        from(file("build/outputs/apk/debug/")) {
            include "*.apk"
        }
        into file("../app/src/main/assets/")
        rename { String fileName ->
            'scrcpy-server.jar'
        }
    }

// Task finalizedBy is kept to ensure standalone server build also copies the artifact
    afterEvaluate {
        tasks.named("assembleRelease") {
            finalizedBy(copyRelease)
        }
        tasks.named("assembleDebug") {
            finalizedBy(copyDebug)
        }
    }
}



dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"

