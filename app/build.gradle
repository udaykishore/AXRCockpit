import org.gradle.api.tasks.Copy

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.10'
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.google.services)
}

configurations.all {
    resolutionStrategy {
        force 'org.bouncycastle:bcprov-jdk15to18:1.78'
        force 'org.bouncycastle:bcpkix-jdk15to18:1.78'
    }
}

def buildDate = new Date().format('yyMMdd')
def artifactVersionName = "1.0.${buildDate}"
def artifactVersionCode = buildDate.toInteger()

android {
    namespace 'com.ukp.axrcockpit'
    compileSdk 36

    defaultConfig {
        applicationId "com.ukp.axrcockpit"
        minSdk 31
        targetSdk 35
        versionCode artifactVersionCode
        versionName artifactVersionName
        setProperty("archivesBaseName", "axrcockpit-${artifactVersionName}")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "ENABLE_UPDATE_CHECK", "true"
        }
        debug {
            debuggable true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "ENABLE_UPDATE_CHECK", "false"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        dataBinding true
        aidl true
        buildConfig true
    }

    applicationVariants.all { variant ->
        def capitalizeName = variant.name.capitalize()
        // Correctly link to the server project copy task to ensure the asset is ready
        def serverTaskPath = ":server:copy${capitalizeName}"
        variant.mergeAssetsProvider.configure {
            dependsOn(serverTaskPath)
        }
        // Ensure lint tasks also depend on it to avoid implicit dependency errors
        project.tasks.configureEach { task ->
            if ((task.name.contains("Lint") || task.name.contains("lint")) && (task.name.contains(capitalizeName) || task.name.contains(variant.name))) {
                task.dependsOn(serverTaskPath)
            }
        }
    }
}


dependencies {
    // Core AndroidX
    implementation("androidx.core:core-ktx:1.17.0")
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("androidx.activity:activity-ktx:1.11.0")
    implementation("androidx.activity:activity-compose:1.11.0")
    implementation("androidx.constraintlayout:constraintlayout-compose-android:1.1.1")

    // Compose Foundation & UI
    implementation("androidx.compose.foundation:foundation:1.9.2")
    implementation("androidx.compose.ui:ui:1.9.2")
    implementation("androidx.compose.ui:ui-tooling-preview:1.9.2")
    implementation("androidx.compose.material3:material3-android:1.4.0")
    implementation("androidx.compose.material:material-icons-core")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.runtime:runtime-livedata:1.9.2")
    debugImplementation("androidx.compose.ui:ui-tooling:1.9.2")

    // UI Components
    implementation("com.google.android.material:material:1.13.0")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation("androidx.compose.material3:material3-window-size-class")

    // ADB & Mirroring (libadb-android 3.1.1+ is 16KB aligned)
    implementation(libs.libadb.android)
    implementation(libs.bcpkix.jdk15to18)
    implementation(libs.bcprov.jdk15to18)
    implementation(libs.conscrypt.android)
    implementation(libs.kotlinx.serialization.json)
    implementation(libs.zxing.core)

    // Room Database
    implementation(libs.androidx.room.runtime)
    kapt(libs.androidx.room.compiler)
    implementation(libs.androidx.room.ktx)

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.1"

    def composeBom = platform('androidx.compose:compose-bom:2025.09.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics

    // Play App Update
    implementation(libs.play.app.update)
    implementation(libs.play.app.update.ktx)
}

task copyPlaystoreIcon(type: Copy) {
    from('src/main')
    into('src/main/res/drawable')
    include('ic_launcher-playstore.png')
    rename('ic_launcher-playstore.png', 'ic_launcher_playstore.png')
}

// Ensure the icon is copied before any build starts
preBuild.dependsOn copyPlaystoreIcon


